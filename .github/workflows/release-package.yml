name: Release package

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install schema for offline tests
        run: |
          npm install --prefix "$RUNNER_TEMP/schema" --ignore-scripts --no-package-lock @deepseek-ai/schemastery@3.18.4
          echo "OCG_SCHEMASTERY=$RUNNER_TEMP/schema/node_modules/@deepseek-ai/schemastery/lib/index.mjs" >> "$GITHUB_ENV"
      - name: Run regression tests
        run: npm test
      - name: Check shipped JavaScript
        run: |
          for file in lib/*.js; do node --check "$file"; done
      - name: Pack release
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-usage-meter
          path: dist/*
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Attach install package and checksum
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tgz dist/SHA256SUMS.txt --clobber
